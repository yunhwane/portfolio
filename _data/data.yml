career-profile:
  title: About
  summary: |
    **3년차 Java 백엔드 엔지니어 · 결제 도메인 & 이벤트 기반 시스템**

    서비스 초기 아키텍처·데이터 모델 설계부터 출시·운영까지 End-to-End로 책임져온 백엔드 개발자입니다.
    신규 B2C 앱을 누적 회원 **15,000명 · MAU 1,000명** 규모로 성장시켰고, PG 연동·망취소·환불 로직으로 결제 안정성을,
    Kafka·Redis 분산 락으로 이벤트 처리 정합성을 지켜왔습니다.
    조회 구조 개선으로는 핵심 API 응답을 **6.44s → 1.24s (80% 단축)** 개선했습니다.

    "왜 이렇게 설계했는가"를 설명할 수 있는 코드를 지향하며, 기술 선택의 trade-off를
    팀에 설명하고 설득하는 일을 좋아합니다.

    **Core Strengths**

    - **백엔드 · 아키텍처** — Spring Boot · JPA/QueryDSL · Kafka/Redis 이벤트 기반 시스템
    - **결제 · 분산 처리** — PG 연동 · 망취소/환불 · 분산 락 · 정합성 보장
    - **품질 · 운영** — 테스트 문화(700+·커버리지 게이트) · Observability (Grafana + Loki) · AWS


