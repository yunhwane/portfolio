experiences:
  title: Experience
  info:
  - role: 주식회사 우리의이야기 — 백엔드 엔지니어
    time: 2025.07 - 현재
    company: 서비스 "퍼플영" 런칭 · 백엔드 아키텍처 책임
    details: |
      > **[대표 성과]** 런칭 당일 **동시접속 2,000명 무장애 처리** — 캐시 히트율 **93%**, 장애 0건
      > Caffeine 로컬 캐시 + 스케줄러 동기화로 병목 대응 · 스택 선정~도메인 API 설계 단독 리드

      - **OAuth2 / OIDC 인증·인가 설계**, JWT Stateless + Refresh Token Rotation 도입 (세션 부하 제거·토큰 탈취 완화)
      - **AI 워크플로우 하네스 구축** — Jira 이슈 → 문서·코드 생성 → 코드 리뷰 자동화 파이프라인(Claude Code 멀티에이전트), **Code Review Agent** 직접 개발
      - 테스트 **460개+ · 커버리지 70%** CI 자동화로 회귀 방지, Grafana + Loki 로깅 구조화
      - **Kafka 도입 trade-off**를 팀에 설득해 이벤트 기반 아키텍처 채택 주도

      _Stack_: Java · Spring Boot · PostgreSQL · OIDC · Caffeine · Grafana · Loki · Claude Code (Agent 파이프라인)

  - role: 빅링크에이아이 — 백엔드 엔지니어
    time: 2023.09 - 2025.05
    company: 결제 · 이벤트 기반 시스템 개발 (1년 9개월)
    details: |
      AI 기반 SNS 자동 포스팅 플랫폼(BIGLINK)과 반려동물 라이브 커머스(PetPlay)에서
      **결제 시스템 안정화**와 **이벤트 기반 아키텍처 도입**을 담당했습니다.

      ---

      **BIGLINK** · AI 기반 SNS 자동 포스팅 (2024.06 ~ 2025.05)

      > **[대표 성과 ①]** 챗봇 프롬프트 조회 **6.44s → 1.24s (80% 단축)** — EXPLAIN 분석 후 **커버링 인덱스** 적용
      > **[대표 성과 ②]** **Transactional Outbox** 도입으로 메시지 유실 **0%** — DB 커밋·Kafka 발행 원자성 보장

      - **KG이니시스 PG 연동 + Kafka 기반 결제 승인 실패 재처리**로 결제 신뢰성 확보
      - 스케일 아웃 스케줄러 중복 실행을 **Redis 분산 락**으로 해소, OAuth 4종을 **전략 패턴**으로 통합

      ---

      **PetPlay** · 반려동물 라이브 커머스 (2023.09 ~ 2024.06)

      - 결제 **망 취소 · 환불 · 재시도**로 실패 복구율 개선, **S3 Presigned URL**로 업로드 병목 해소
      - 6개 플랫폼 OAuth를 단일 인증 구조로 추상화, 정산 · 쿠폰 등 신규 도메인 설계
      - PO와 **우선순위 협의로 일정 내 릴리즈**, Outbox·분산 락 사례를 팀 기술 공유 세션에서 발표

      _Stack_: Java · Spring Boot · MySQL · Kafka · Redis · AWS · JPA

  - role: 그로스 헬퍼 — 사이드 프로젝트 (백엔드 단독)
    time: 2023.06 - 2024.06
    company: 설문/인터뷰 매칭 플랫폼 · 기획 참여
    details: |
      대학생·스타트업 대상 설문/인터뷰 매칭 플랫폼을 기획 단계부터 참여하여
      **백엔드를 단독으로 설계·개발·운영**했습니다.
      🔗 [GitHub Organization](https://github.com/GrowthHelper-Intermission)

      **주요 성과**

      - 앱스토어·플레이스토어 출시 후 **MAU 1,000+ · 누적 거래액 약 $30K** 규모로 성장
      - **GitHub Actions + Docker 기반 CI/CD**를 직접 구축해 백엔드 단독 운영
      - 신뢰도 높은 매칭을 위한 **스크리닝 기반 필터링 시스템** 설계·구현

