experiences:
  title: Experience
  info:
  - role: 주식회사 우리의이야기 — 백엔드 엔지니어
    time: 2025.07 - 현재
    company: 서비스 "퍼플영" 런칭 · 백엔드 아키텍처 책임
    details: |
      **[대표 성과] 런칭 당일 동시접속 2,000명 무장애 처리 — 장애·다운타임 0건**

      - **Situation** 신규 서비스 런칭 · 마케팅 유입 집중으로 트래픽 폭증 예상
      - **Action** 기술 스택 선정(Spring Boot · PostgreSQL · Caffeine)부터 도메인 API 구조 설계까지 단독 리드.
        병목 예상 구간에 Caffeine 로컬 캐시 + 스케줄러 동기화 구조 적용
      - **Result** 출시 당일 동접 **2,000명 / 장애 0건**, 캐시 히트율 **93%** 달성

      **아키텍처 · 인증**

      - OAuth2 / OIDC 기반 인증·인가 구조 설계, **JWT Stateless + Refresh Token Rotation** 도입으로
        세션 서버 부하 제거 및 토큰 탈취 리스크 완화
      - 기존 시스템 데이터를 신규 스키마로 **무중단 마이그레이션**, 정합성 검증 로직 구현

      **품질 · 운영**

      - 테스트 코드 **460개 이상 · 커버리지 70%** 유지, CI에서 자동 실행 → 회귀 방지 체계 확립
      - **Grafana + Loki** 기반 로깅 구조화로 장애 탐지·원인 분석 시간 단축
      - AI 에이전트 오케스트레이션 시스템 설계 (Claude Code 멀티에이전트 파이프라인)

      **협업 · 기술적 의사결정**

      - 기획·프론트엔드 팀과 주간 API 스펙 리뷰를 운영해 런칭 직전 스펙 변경 리스크 차단
      - Kafka 도입의 운영 부담 vs 장기 확장성을 팀에 설명·설득하여 이벤트 기반 아키텍처 채택 주도

      _Stack_: Java · Spring Boot · PostgreSQL · OIDC · Caffeine · Grafana · Loki

  - role: 빅링크에이아이 — 백엔드 엔지니어
    time: 2023.09 - 2025.05
    company: 결제 · 이벤트 기반 시스템 개발 (1년 9개월)
    details: |
      AI 기반 SNS 자동 포스팅 플랫폼(BIGLINK)과 반려동물 라이브 커머스(PetPlay)에서
      **결제 시스템 안정화**와 **이벤트 기반 아키텍처 도입**을 담당했습니다.

      ---

      **BIGLINK** · AI 기반 SNS 자동 포스팅 플랫폼 (2024.06 ~ 2025.05)

      **[대표 성과 ①] 챗봇 프롬프트 조회 응답시간 80% 단축 (6.44s → 1.24s)**

      - **Situation** 프롬프트 조회 응답 6.44초로 사용자 이탈 우려
      - **Action** `EXPLAIN`으로 실행 계획 분석 → 인덱스 풀스캔 병목 확인 후
        **커버링 인덱스** 설계·적용
      - **Result** **응답 시간 6.44s → 1.24s**, 사용자 체감 성능 대폭 향상

      **[대표 성과 ②] Transactional Outbox 패턴 도입 · 메시지 유실률 0%**

      - **Situation** 자동 포스팅 예약 시 DB 커밋과 Kafka 발행 간 원자성 미보장 → 메시지 유실 리스크
      - **Action** **Transactional Outbox 패턴** 설계·적용, 발행 재시도 구조 구축
      - **Result** 메시지 유실 0건, 장애 상황에서도 예약 데이터 정합성 보장

      **기타 성과**

      - 스케일 아웃 환경의 스케줄러 중복 실행 문제를 **Redis 분산 락**으로 해결
      - **KG이니시스 PG 연동 및 Kafka 기반 결제 승인 실패 재처리** 구현으로 결제 신뢰성 확보
      - 네이버·카카오·구글·애플 OAuth를 **전략 패턴**으로 통합, 신규 공급자 추가 비용 최소화
      - AWS 로드밸런서 · Route 53 · staging / production 환경 구축

      ---

      **PetPlay** · 반려동물 인플루언서 라이브 커머스 (2023.09 ~ 2024.06)

      - 결제 **망 취소 · 환불 · 재시도 로직** 구현으로 결제 성공률 향상
      - 6개 플랫폼(네이버·카카오·인스타·페이스북·틱톡·X) OAuth를 **전략 패턴**으로 단일 구조 통합
      - 이미지 업로드 병목을 **AWS S3 Presigned URL** 방식으로 전환, 서버 부하 해소
      - 원고 컨펌 · 방문형 쿠폰 · 정산 API 신규 도메인 설계

      **협업**

      - 외부 SNS API 스펙 변경 이슈 발생 시 PO와 협의하여 **필수 기능 우선 배포 → 추가 기능 차기 스프린트 이관**
        전략으로 일정 내 릴리즈 달성
      - Outbox 패턴·분산 락 적용 사례를 팀 내 기술 공유 세션에서 발표하여 구현 역량 확산에 기여

      _Stack_: Java · Spring Boot · MySQL · Kafka · Redis · AWS · JPA

  - role: 그로스 헬퍼 — 사이드 프로젝트 (백엔드 단독)
    time: 2023.06 - 2024.06
    company: 설문/인터뷰 매칭 플랫폼 · 기획 참여
    details: |
      대학생·스타트업 대상 설문/인터뷰 매칭 플랫폼을 기획 단계부터 참여하여
      **백엔드를 단독으로 설계·개발·운영**했습니다.
      🔗 [GitHub Organization](https://github.com/GrowthHelper-Intermission)

      **주요 성과**

      - **MAU 1,000명 이상 · 누적 매출 $30,000** 확보
      - 앱스토어·플레이스토어 출시, **GitHub Actions + Docker 기반 CI/CD** 직접 구축
      - 신뢰성 있는 매칭을 위한 **스크리닝 기반 필터링 시스템** 설계·구현

      _Stack_: Spring · JPA · MySQL · Redis · Docker · GitHub Actions · AWS


