experiences:
  title: Experience & Projects
  info:
  - role: 퍼플영 — 백엔드 아키텍처 설계 주도
    time: 2025.07 - 현재
    company: 주식회사 우리의이야기
    details: |
      서비스 런칭 초기부터 백엔드 아키텍처 설계를 주도하며, 안정적인 운영 환경 구축과 코드 품질 관리를 함께 책임지고 있습니다.

      - **백엔드 아키텍처 설계 주도** — 초기 기술 스택 선정부터 핵심 도메인 API 구조 설계까지 전 과정을 리드, Spring Boot + PostgreSQL 기반 확장 가능한 REST API 구현
      - **테스트 문화 정착** — 테스트 커버리지 70% 유지, 460개 이상의 테스트 코드 작성으로 회귀 버그 방지 및 배포 안정성 확보. CI 파이프라인에 테스트 자동 실행 연동
      - **출시 당일 트래픽 안정 처리** — 앱 출시 첫날 약 2,000명 동시 유입을 장애 없이 처리, 안정적인 초기 서비스 운영
      - **인증 시스템 설계** — OAuth2/OIDC 기반 인증·인가 구조 설계, JWT Stateless + Refresh Token Rotation 도입으로 보안 강화 및 인증 성능 개선
      - **캐시 전략 적용** — 공통 코드 관리 테이블에 Caffeine 로컬 캐시 적용, 불필요한 DB 접근 최소화 및 조회 성능 개선
      - **데이터 마이그레이션** — 기존 시스템 데이터를 신규 스키마로 무중단 전환, 데이터 변환 및 정합성 검증 로직 구현으로 오류 없는 이전 완료
      - **성능 중심 DB 설계** — PostgreSQL 기반 스키마 설계 및 쿼리 튜닝으로 조회 성능 최적화

      _Stack_: Java · Spring Boot · PostgreSQL · OIDC · Caffeine Cache

  - role: BIGLINK — AI 기반 SNS 자동 포스팅 플랫폼
    time: 2024.06 - 2025.05
    company: 빅링크에이아이
    details: |
      AI 기반 SNS 자동 포스팅 플랫폼의 핵심 백엔드 기능을 담당했습니다.

      - **챗봇 프롬프트 조회 성능 80% 개선** — 커버링 인덱스 적용으로 응답속도 6.44s → 1.24s 단축
      - **Transactional Outbox 패턴 도입** — 자동 포스팅 예약 시 Kafka 메시지 유실 방지를 위해 Outbox 패턴 설계 및 적용, 데이터 정합성 보장
      - **분산 락으로 스케줄러 안정화** — 스케일 아웃 환경에서 Redis 분산 락 도입, 다중 서버 간 중복 실행 문제 해결
      - **결제 시스템 고도화** — KG이니시스 PG 연동 및 Kafka 기반 결제 승인 실패 재처리 구현
      - **전략 패턴 기반 소셜 로그인** — 네이버, 카카오, 구글, 애플 OAuth를 Strategy Pattern으로 통합 설계, 확장성 확보
      - 네이버·페이스북·인스타그램 자동 포스팅 기능 개발
      - **AWS 인프라 구축** — 로드밸런서, Route 53, staging/production 환경 직접 설정

      _Stack_: Java · Spring Boot · MySQL · Kafka · Redis · AWS

  - role: PetPlay — 반려동물 인플루언서 라이브 커머스
    time: 2023.09 - 2024.06
    company: 빅링크에이아이
    details: |
      반려동물 특화 인플루언서 라이브 커머스 플랫폼의 백엔드 개발을 담당했습니다.

      - **다중 SNS 인증 서버 구축** — 6개 플랫폼(네이버, 카카오, 인스타그램, 페이스북, 틱톡, X) OAuth를 전략 패턴으로 단일 구조에 통합
      - **결제 시스템 고도화** — KG이니시스 PC 결제 추가, 망 취소·환불 기능 구현, Kafka 기반 결제 실패 재시도로 결제 성공률 향상
      - **이미지 업로드 병목 해소** — AWS Presigned URL 전환으로 대용량 이미지 처리 부하 제거
      - **신규 도메인 API 개발** — 원고 컨펌, 방문형 쿠폰, 정산 API 설계 및 구현

      _Stack_: Spring Boot · MySQL · Kafka · JPA · AWS

  - role: 그로스 헬퍼 — 설문/인터뷰 매칭 플랫폼
    time: 2023.06 - 2024.06
    company: 사이드 프로젝트 (백엔드 단독 개발 · 기획 참여)
    details: |
      대학생·스타트업을 위한 설문/인터뷰 매칭 플랫폼에서 **백엔드를 단독으로 개발**하고 **서비스 기획에 참여**했습니다.
      🔗 [GitHub Organization](https://github.com/GrowthHelper-Intermission)

      - **앱스토어·플레이스토어 출시** — CI/CD(GitHub Actions + Docker) 구축 후 직접 출시, 퍼포먼스 마케팅으로 **MAU 1,000명+ 달성, 누적 매출 $30,000 확보**
      - **스크리닝 기반 매칭 시스템** — 신뢰성 강화를 위한 다양한 필터링 조건 설계 및 구현

      _Stack_: Spring Framework · JPA · MySQL · Redis · Docker · GitHub Actions · AWS

