career-profile:
  title: About
  summary: |
    **결제·분산 시스템을 중심으로 3년간 백엔드를 설계·운영해온 엔지니어** 전윤환입니다.

    서비스 런칭부터 아키텍처를 책임지며, 앱 출시 당일 2,000명 동시 트래픽을
    무장애로 처리했습니다. KG이니시스 PG 연동, Kafka 기반 결제 실패 재처리,
    Transactional Outbox 패턴을 도입해 결제 정합성을 보장해왔고,
    커버링 인덱스 적용으로 주요 쿼리 응답을 6.44s → 1.24s로 단축한 경험이 있습니다.

    "왜 이렇게 설계했는가"를 설명할 수 있는 코드를 지향합니다.
    최근에는 이벤트 기반 아키텍처와 Observability에 관심을 두고
    기술 선택의 trade-off를 팀에 설명하고 설득하는 일을 좋아합니다.

