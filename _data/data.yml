experiences:
  title: Experience
  info:
  - role: 주식회사 우리의이야기 — 백엔드 엔지니어
    time: 2025.07 - 현재
    company: 신규 B2C 앱 "퍼플영" 런칭 · 백엔드 아키텍처 책임
    details: |
      > **[대표 성과]** 신규 B2C 앱 백엔드를 초기 설계부터 단독 리드 — 누적 회원 **15,000명 · MAU 1,000명** 규모로 성장·운영
      > 아키텍처·데이터 모델 설계 → 핵심 도메인 API 개발 → 앱 출시 → 배포·운영 전반 주도

      - **테스트 문화 구축** — 테스트 작성·코드 리뷰 기준 정립, 핵심 도메인·API 대상 **단위·통합 테스트 700건+** 확보
      - **JaCoCo 모듈별 커버리지 게이트**를 CI 검증에 적용 — Domain **50%**, API·Repository **25%** 이상 유지
      - **2-Tier Cache** (Local + Redis)로 금지어 조회 DB 접근 최소화, **Redis Pub/Sub**으로 분산 환경 Local Cache 무효화해 정합성 확보
      - **AI 개발 Harness 설계** — 컨텍스트 문서·ADR·작업 계획·테스트 시나리오·리뷰 절차로 요구사항 분석~구현·검증 워크플로우 팀 표준화
      - **구조화 로깅** — MDC + Logstash Encoder, 요청별 Trace ID로 Loki·Grafana에서 사용자 요청·오류 흐름 검색·추적

      _Stack_: Java · Spring Boot · Spring Data JPA · QueryDSL · PostgreSQL · Redis · Kafka · JUnit 5 · Mockito · RestAssured · Testcontainers · JaCoCo · Loki · Grafana · Docker · AWS · GitHub Actions

  - role: 빅링크에이아이 — 백엔드 엔지니어
    time: 2023.09 - 2025.05
    company: AI 기반 SNS 자동 포스팅 플랫폼 · 결제 · 이벤트 기반 시스템 (1년 9개월)
    details: |
      > **[회사 성과]** 교보생명 오픈 이노베이션 · 경기도 혁신 이노베이션 선정 · 창업 성장 기술 R&D 디딤돌·TIPS 선정 · 삼성전자 무선사업부 '삼성피켓' 공동 사업
      > **[대표 성과]** 챗봇 프롬프트 조회 구조 개선으로 응답 속도 **6.44s → 1.24s (80% 단축)**

      - **SNS 자동 포스팅·예약 발행** (네이버 블로그·페이스북·인스타그램) 개발
          - **Kafka 비동기 처리**로 예약 발행 데이터 안정 처리·정합성 확보
          - **Redis 분산 락**으로 스케일아웃 환경에서 예약 작업 중복 실행 방지
      - **결제 흐름 고도화** — 안정성·유지보수성 개선, 통신 장애 대응 **망취소·환불 로직** 구현
      - **원고 컨펌 기능** (광고주↔인플루언서 작성·검수·수정 요청·승인) 개발
          - **S3 Presigned URL** 기반 다중 이미지 직접 업로드 + **S3 Event·Lambda** 비동기 리사이징 파이프라인 설계
          - **CloudFront CDN**으로 대용량 이미지 처리 부하 분산·제공 구조 개선
      - **코드 리뷰 기준·PR 프로세스·테스트 작성 기준** 정립으로 팀 협업·코드 품질 관리 체계 개선

      _Stack_: Java · Spring Boot · Spring Data JPA · QueryDSL · PostgreSQL · Redis · Kafka · AWS S3 · Lambda · CloudFront · Docker · GitHub Actions

  - role: 그로스 헬퍼 — 사이드 프로젝트 (백엔드 단독)
    time: 2023.06 - 2024.06
    company: 설문/인터뷰 매칭 플랫폼 · 기획 참여
    details: |
      대학생·스타트업 대상 설문/인터뷰 매칭 플랫폼을 기획 단계부터 참여하여
