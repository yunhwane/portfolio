career-profile:
  title: About Me
  summary: |
    시스템 설계와 결제 도메인 경험을 보유한 **3년차 백엔드 개발자** 전윤환입니다.
    서비스 초기 단계부터 백엔드 아키텍처 설계를 주도하고,
    **앱 출시 당일 2,000명 동시 트래픽을 장애 없이 처리**한 경험이 있습니다.

    **KG 이니시스 PG 결제 시스템 구축**, **Kafka 기반 결제실패 재처리**,
    **Transactional Outbox 패턴**을 통한 메시지 유실 방지 등
    결제 안정성과 데이터 정합성을 최우선으로 개발해 왔습니다.

    분산 락, 이벤트 기반 아키텍처, Observability 환경 구축 등 확장 가능한
    시스템을 설계·운영하며, **백엔드 단독 개발 및 기획에 참여한 사이드 프로젝트**로
    **$30,000 매출** 및 **1,000+ 활성 사용자**를 확보한 경험이 있습니다.

