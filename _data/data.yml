experiences:
  title: Experience
  info:
  - role: 주식회사 우리의이야기 — 백엔드 엔지니어
    time: 2025.07 - 현재
    company: 서비스 "퍼플영" 런칭 · 백엔드 아키텍처 책임
    details: |
      서비스 런칭 초기부터 백엔드 아키텍처 설계를 주도하고,
      출시 이후의 안정성과 품질 관리를 책임지고 있습니다.

      **아키텍처 · 인증**

      - 초기 기술 스택 선정부터 핵심 도메인 API 구조 설계까지 전 과정 리드 (Spring Boot + PostgreSQL)
      - OAuth2 / OIDC 기반 인증·인가 구조 설계, JWT Stateless + Refresh Token Rotation 도입

      **안정성 · 성능**

      - 앱 출시 첫날 **약 2,000명 동시 유입을 장애 없이 처리**
      - 공통 코드 관리 테이블에 Caffeine 로컬 캐시 적용, DB 부하 절감
      - 기존 시스템 데이터를 신규 스키마로 무중단 마이그레이션, 정합성 검증 로직 구현

      **품질 · 운영**

      - 테스트 코드 **460개 이상 · 커버리지 70%** 유지, CI에서 테스트 자동 실행
      - Grafana + Loki 기반 로깅 구조화로 장애 탐지·분석 효율 개선
      - AI 에이전트 오케스트레이션 시스템 설계 (Claude Code 멀티에이전트 파이프라인)

      _Stack_: Java · Spring Boot · PostgreSQL · OIDC · Caffeine · Grafana · Loki

  - role: 빅링크에이아이 — 백엔드 엔지니어
    time: 2023.09 - 2025.05
    company: 결제 · 이벤트 기반 시스템 개발 (1년 9개월)
    details: |
      AI 기반 SNS 자동 포스팅 플랫폼(BIGLINK)과 반려동물 라이브 커머스(PetPlay)에서
      결제 시스템 안정화와 이벤트 기반 아키텍처 도입을 담당했습니다.

      **BIGLINK** · AI 기반 SNS 자동 포스팅 플랫폼 (2024.06 ~ 2025.05)

      - 챗봇 프롬프트 조회에 커버링 인덱스 적용, **응답속도 6.44s → 1.24s (80% 개선)**
      - 자동 포스팅 예약 시 Kafka 메시지 유실을 막기 위해 **Transactional Outbox 패턴** 설계·적용
      - 스케일 아웃 환경의 스케줄러 중복 실행 문제를 **Redis 분산 락**으로 해결
      - KG이니시스 PG 연동 및 **Kafka 기반 결제 승인 실패 재처리** 구현
      - 네이버·카카오·구글·애플 OAuth를 전략 패턴으로 통합
      - AWS 로드밸런서 · Route 53 · staging / production 환경 구축

      **PetPlay** · 반려동물 인플루언서 라이브 커머스 (2023.09 ~ 2024.06)

      - 결제 **망 취소 · 환불 · 재시도 로직** 구현으로 결제 성공률 향상
      - 6개 플랫폼(네이버·카카오·인스타·페이스북·틱톡·X) OAuth를 전략 패턴으로 단일 구조 통합
      - 이미지 업로드 병목을 **AWS Presigned URL 방식**으로 전환, 서버 부하 제거
      - 원고 컨펌 · 방문형 쿠폰 · 정산 API 신규 도메인 설계

      _Stack_: Java · Spring Boot · MySQL · Kafka · Redis · AWS · JPA

  - role: 그로스 헬퍼 — 사이드 프로젝트
    time: 2023.06 - 2024.06
    company: 백엔드 단독 개발 · 기획 참여
    details: |
      대학생·스타트업을 위한 설문/인터뷰 매칭 플랫폼을 기획 단계부터 참여하여
      백엔드를 단독으로 설계·개발·운영했습니다.
      🔗 [GitHub Organization](https://github.com/GrowthHelper-Intermission)

      - **MAU 1,000명 이상 · 누적 매출 $30,000** 확보
      - 앱스토어·플레이스토어 출시, GitHub Actions + Docker 기반 **CI/CD 직접 구축**
      - 신뢰성 있는 매칭을 위한 스크리닝 기반 필터링 시스템 설계·구현

      _Stack_: Spring · JPA · MySQL · Redis · Docker · GitHub Actions · AWS

