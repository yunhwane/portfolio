career-profile:
  title: About
  summary: |
    **3년차 Java 백엔드 엔지니어 · 결제 도메인 & 분산 시스템 특화**

    서비스 초기 아키텍처 설계부터 런칭·운영까지 End-to-End로 책임져온 백엔드 개발자입니다.
    **앱 출시 당일 동시접속 2,000명을 무장애로 처리**했고, KG이니시스 PG 연동·Kafka 기반 결제 재처리·
    **Transactional Outbox 패턴**을 도입해 결제 정합성을 보장해왔습니다.
    커버링 인덱스 설계로 핵심 쿼리 응답을 **6.44s → 1.24s (80% 개선)** 단축한 경험이 있습니다.

    "왜 이렇게 설계했는가"를 설명할 수 있는 코드를 지향하며, 기술 선택의 trade-off를
    팀에 설명하고 설득하는 일을 좋아합니다.

    **Core Strengths**
    `Spring Boot · JPA` · `Kafka · Redis 분산 시스템` · `결제 도메인 (PG · Outbox · 분산 락)`
    · `쿼리 최적화` · `Observability (Grafana + Loki)` · `AWS 기반 운영`


