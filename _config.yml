# Update all the sections by editing the data.yml file inside _data folder.

# Site Settings
title: 전윤환 | Backend Engineer
url: 'https://yunhwane.github.io'

# username.github.io 리포는 baseurl 비워둠
# baseurl: ''

description: Backend Engineer · 결제 · 분산 시스템 · Spring Boot
theme_skin: blue # blue turquoise green berry orange ceramic teal oceanstale
chrome_mobile_color:

# Tracker (Google Analytics를 쓰지 않으면 비워두세요)
analytics:

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
compress-site: yes

encoding: "utf-8"
compress_html:
  clippings: all
  ignore:
    envs: development

# Development Settings
port: 4000
host: 0.0.0.0
safe: false
